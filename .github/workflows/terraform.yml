name: CD - Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

      key_name:
        description: "EC2 key pair name for SSH access"
        required: true

      tf_auto_approve:
        description: "Auto approve apply/destroy?"
        required: false
        default: "true"

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: terraform plan -input=false -var="key_name=${{ github.event.inputs.key_name }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          if [ "${{ github.event.inputs.tf_auto_approve }}" = "true" ]; then
            terraform apply -input=false -auto-approve -var="key_name=${{ github.event.inputs.key_name }}"
          else
            terraform apply -input=false -var="key_name=${{ github.event.inputs.key_name }}"
          fi

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          if [ "${{ github.event.inputs.tf_auto_approve }}" = "true" ]; then
            terraform destroy -input=false -auto-approve -var="key_name=${{ github.event.inputs.key_name }}"
          else
            terraform destroy -input=false -var="key_name=${{ github.event.inputs.key_name }}"
          fi

      - name: Output Deployment Summary
        if: github.event.inputs.action == 'apply'
        run: |
          echo "### Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public IP:** $(terraform output -raw ec2_public_ip)" >> $GITHUB_STEP_SUMMARY
          echo "**Image Deployed:** $(terraform output -raw deployed_image)" >> $GITHUB_STEP_SUMMARY
          echo "**Strapi URL:** http://$(terraform output -raw ec2_public_ip):1337" >> $GITHUB_STEP_SUMMARY

