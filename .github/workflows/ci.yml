name: CI — Build & Push Image (ECR)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 164971840296
  ECR_REPOSITORY: strapi-repo-aditya

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.push.outputs.image_tag }}
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}

      - name: Build, tag and push to ECR
        id: push
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          REPO_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          echo "Building image..."
          docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} .

          echo "Tagging image..."
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${REPO_URI}:${IMAGE_TAG}
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${REPO_URI}:latest

          echo "Pushing image..."
          docker push ${REPO_URI}:${IMAGE_TAG}
          docker push ${REPO_URI}:latest

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${REPO_URI}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
