name: CI — Build & Push Image (ECR)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set.outputs.image_tag }}
      image_uri: ${{ steps.set.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          IMAGE_TAG="${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" > image_tag.txt

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registry-type: private
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}

      - name: Build, tag and push to ECR
        id: push
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}        # e.g. 164971840296.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}    # e.g. strapi-repo-aditya
        run: |
          REPO_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "REPO_URI=${REPO_URI}"
          docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${REPO_URI}:${IMAGE_TAG}
          docker push ${REPO_URI}:${IMAGE_TAG}
          echo "image_uri=${REPO_URI}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Persist outputs
        id: set
        run: |
          # read GITHUB_OUTPUT to set job outputs
          if [ -f "$GITHUB_OUTPUT" ]; then
            grep '^image_tag=' "$GITHUB_OUTPUT" | sed 's/^image_tag=//'
            grep '^image_uri=' "$GITHUB_OUTPUT" | sed 's/^image_uri=//'
          fi
          echo "::set-output name=image_tag::$(cat image_tag.txt)"
          # echo image_uri again if present
          if grep -q '^image_uri=' "$GITHUB_OUTPUT"; then
            IMAGE_URI=$(grep '^image_uri=' "$GITHUB_OUTPUT" | sed 's/^image_uri=//')
            echo "::set-output name=image_uri::$IMAGE_URI"
          fi
